name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Merge gate body
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all jobs to succeed
        run: test "${{ needs.gate.result }}" = "success"
